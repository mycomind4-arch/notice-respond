# Fly.io configuration for FairProcess API Server
# Run: fly launch --dockerfile Dockerfile

app = "fairprocess-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[env]
  PORT = "3001"
  NODE_ENV = "production"

# Required deployment configuration:
# fly secrets set DATABASE_URL=postgresql://...
# fly secrets set OIDC_ISSUER=https://identity.example.com
# fly secrets set OIDC_AUDIENCE=fairprocess-api
# fly secrets set CORS_ORIGIN=https://app.example.com
# Optional when OIDC discovery is unavailable:
# fly secrets set OIDC_JWKS_URI=https://identity.example.com/.well-known/jwks.json
