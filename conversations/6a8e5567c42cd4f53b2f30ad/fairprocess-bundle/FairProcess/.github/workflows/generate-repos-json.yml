name: Generate repos.json

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-repos-json.yml"
      - ".github/scripts/generate-repos-json.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate repos.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-repos-json.mjs

      - name: Push repos.json to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or switch to data branch
          git checkout -b data

          # Commit and force push
          git add repos.json
          if git diff --cached --quiet; then
            echo "No changes to repos.json"
          else
            git commit -m "chore: refresh repos.json [skip ci]"
            git push --force origin data
          fi
