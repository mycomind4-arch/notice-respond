name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fairprocess
          POSTGRES_PASSWORD: fairprocess-ci
          POSTGRES_DB: fairprocess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fairprocess -d fairprocess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fairprocess:fairprocess-ci@localhost:5432/fairprocess
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true
      - name: Lint and typecheck maintained code
        run: pnpm lint
      - name: Audit production dependencies
        run: pnpm audit:dependencies
      - name: Scan repository history for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --no-banner --exit-code=1 .
      - name: Verify database migration lifecycle
        run: |
          pnpm --filter @fairprocess/database migrate
          pnpm --filter @fairprocess/database migrate:down
          pnpm --filter @fairprocess/database migrate
      - name: Run tests
        shell: bash
        run: |
          set +e
          pnpm test > /tmp/fairprocess-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Failing test output"
            tail -n 240 /tmp/fairprocess-tests.log
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 80 /tmp/fairprocess-tests.log
      - name: Upload failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fairprocess-test-failure
          path: /tmp/fairprocess-tests.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Verify final clean build
        run: pnpm build
