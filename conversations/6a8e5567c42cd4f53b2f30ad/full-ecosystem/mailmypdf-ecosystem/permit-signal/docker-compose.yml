services:
  api:
    build:
      context: .
      args:
        INSTALL_FULL_ENGINES: ${INSTALL_FULL_ENGINES:-false}
    environment:
      PERMIT_SIGNAL_ENV: ${PERMIT_SIGNAL_ENV:-development}
      PERMIT_SIGNAL_DATABASE_PATH: /data/permit-signal.db
      PERMIT_SIGNAL_REQUEST_TIMEOUT_SECONDS: ${PERMIT_SIGNAL_REQUEST_TIMEOUT_SECONDS:-30}
      PERMIT_SIGNAL_USER_AGENT: ${PERMIT_SIGNAL_USER_AGENT:-PermitSignal/0.1}
      PERMIT_SIGNAL_MAX_PAGES_PER_RUN: ${PERMIT_SIGNAL_MAX_PAGES_PER_RUN:-25}
      PERMIT_SIGNAL_LOG_LEVEL: ${PERMIT_SIGNAL_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - permit_signal_data:/data
    restart: unless-stopped

volumes:
  permit_signal_data:
